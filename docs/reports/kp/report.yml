version: 1

document:
  output: "./build/Курсовой проект - Распределённое хранилище данных сервиса бронирования отелей TourFlow.docx"
  title_page:
    template: orlov-kp
    params:
      discipline: "Распределённые хранилища данных"
      work_title: "Распределённое хранилище данных сервиса бронирования отелей TourFlow"
      variant: "Группа УВП-271"
      student: "Орлов Андрей Витальевич"
      teacher: "старший преподаватель Заманов Е. А."
  toc: true

content:
  - type: heading
    text: "Введение"
    level: 1
    structural: true
  - type: paragraph
    text: >
      Предметная область проекта - бронирование отелей для турфирмы. В одной области выполнены
      практические работы двух дисциплин, и результат собран в единую систему TourFlow: пять сервисов
      на Go, PostgreSQL, Kafka и одностраничное клиентское приложение.
  - type: paragraph
    text: >
      Цель проекта - спроектировать хранение данных распределённой системы так, чтобы для каждого
      решения были названы альтернатива, выигрыш и цена, а заявленные свойства подтверждались
      воспроизводимой проверкой.
  - type: paragraph
    text: >
      Задачи проекта: провести границы сервисов и границы владения данными; выбрать модель размещения
      арендаторов и защитить данные на двух независимых уровнях; сохранить ограничение «продано не
      больше, чем номеров» при конкурентных запросах; обеспечить надёжную передачу событий между
      сервисами; измерить систему под нагрузкой и проверить инварианты после опытов.
  - type: paragraph
    text: >
      Журнал проекта содержит 121 запись: 110 решений с альтернативой и ценой и 11 осознанных
      пробелов. В пояснительной записке приведены основные из них. Отдельно ведётся журнал из 16
      дефектов, найденных тестами, рецензией и замером.

  - type: heading
    text: "1 Предметная область и границы сервисов"
    level: 1
    structural: true
  - type: heading
    text: "1.1 Роли и ключевое правило"
    level: 2
    structural: false
  - type: paragraph
    text: >
      В системе три роли. Клиент ищет отель и бронирует номер. Менеджер ведёт свои отели и видит их
      брони. Администратор заводит отели, назначает менеджеров и может отключить отель. Продаётся не
      конкретный номер, а категория номеров на полуинтервал дат от заезда до выезда. Ключевое правило
      системы: на каждую ночь продано не больше номеров, чем есть в категории.
  - type: figure
    caption: "Витрина отелей"
    path: "./images/03-ui-home.png"
  - type: figure
    caption: "Бронирование номера клиентом"
    path: "./images/03-ui-book.png"
  - type: heading
    text: "1.2 Сервисы и силы, которые их разделяют"
    level: 2
    structural: false
  - type: paragraph
    text: >
      Система разделена на пять сервисов (рисунок 3). Каждая граница обоснована силой дезинтеграции
      или интеграции, а не предпочтением. При объёме порядка тысячи броней в день такое
      разделение избыточно: одно приложение с теми же модулями было бы проще в сопровождении. Сервисы
      выделены, чтобы на одной предметной области отработать материал обеих дисциплин.
  - type: figure
    caption: "Сервисы, базы данных и потоки событий"
    path: "./images/01-architecture.png"
  - type: table
    caption: "Границы сервисов"
    headers: ["Решение", "Сила", "Обоснование и цена"]
    rows:
      - ["notification отдельно от booking", "Дезинтеграция: отказоустойчивость", "Сбой рассылки не должен останавливать бронирование. Цена - уведомление приходит с задержкой"]
      - ["identity отдельно", "Дезинтеграция: безопасность", "Хэши паролей и ключи подписи находятся в одном месте"]
      - ["catalog и booking разделены", "Дезинтеграция: изменчивость и нагрузка", "Описание отелей читается часто и меняется редко, продажи - частые записи под блокировками"]
      - ["Остатки и брони в одном booking", "Интеграция: транзакция базы данных", "Правило вместимости держит одна локальная транзакция. Цена - самый крупный сервис, остатки нельзя масштабировать отдельно"]
      - ["gateway без бизнес-логики", "-", "Маршруты, проверка токена, лимиты и прерыватель; не оркестратор"]
  - type: paragraph
    text: >
      Главное из этих решений - четвёртое. Отдельный сервис остатков превратил бы простую бронь в
      распределённую транзакцию с компенсациями. Сила интеграции перевесила.

  - type: heading
    text: "2 Владение данными"
    level: 1
    structural: true
  - type: paragraph
    text: >
      У каждой таблицы один владелец, и пишет в неё только он. Совместного владения таблицами в системе
      нет. Распределение приведено в таблице 2.
  - type: table
    caption: "Владение данными"
    headers: ["Сервис", "Владеет", "Читает копию чужого"]
    rows:
      - ["identity", "Пользователи, роли, токены обновления", "-"]
      - ["catalog", "Отели, менеджеры отелей, категории номеров", "-"]
      - ["booking", "Остатки по дням, брони, ключи идемпотентности, аудит", "Реплика отелей, категорий и менеджеров"]
      - ["notification", "Уведомления", "-"]
  - type: paragraph
    text: >
      Три решения обеспечивают это правило. Первое: у каждого сервиса своя база и свои роли, чужая роль
      не может к ней подключиться. Физически это один сервер PostgreSQL; цена - общая точка отказа.
      Второе: сервису бронирования нужны данные каталога, но синхронно он их не запрашивает. Каталог
      публикует событие-снимок с версией, booking ведёт у себя реплику. При отказе каталога брони
      продолжают создаваться; цена - реплика отстаёт примерно на секунду. Третье: линия разреза между
      каталогом и бронированием - «описание против продажи»: сколько номеров в категории, решает
      каталог, сколько продано на ночь - бронирование.
  - type: paragraph
    text: >
      Владение темой брокера остаётся соглашением: брокер работает без аутентификации, и запись в тему
      технически доступна любому процессу внутренней сети. Это записано в журнале как граница учебной
      сборки.

  - type: heading
    text: "3 Размещение арендаторов и защита данных"
    level: 1
    structural: true
  - type: heading
    text: "3.1 Модель размещения"
    level: 2
    structural: false
  - type: paragraph
    text: >
      Арендатор в системе - отель, а для броней ещё и клиент. Выбрана общая модель: строки всех отелей
      и клиентов лежат в одних таблицах. Отдельная схема или база на арендатора для десятков тысяч
      клиентов невозможна, а для отелей не оправдана нагрузкой. Цена общей модели - ошибка в политике
      открывает данные всех сразу. Поэтому защита построена на двух независимых уровнях.
  - type: heading
    text: "3.2 Два уровня принуждения"
    level: 2
    structural: false
  - type: table
    caption: "Уровни защиты данных"
    headers: ["Уровень", "Что делает"]
    rows:
      - ["Приложение", "Личность берётся только из проверенного токена, и в gateway, и в сервисе. Правила домена решают, чью бронь можно видеть и отменять. Списки менеджера сервис ограничивает его отелями"]
      - ["База данных", "Защита строк с принуждением на бронях, аудите, ключах идемпотентности и очереди событий. Запросы идут под ролью данных, которая таблицами не владеет и снять защиту не может"]
  - type: paragraph
    text: >
      Уровни проверены по отдельности (рисунок 4). Один тест выключает политики в базе и убеждается,
      что приложение само не отдаёт менеджеру чужого отеля ни броней, ни аудита. Остальные идут прямым
      SQL мимо приложения под ролью данных: чужое не читается и не меняется, строку за другого не
      записать, без контекста возвращается ноль строк, роль данных не снимает защиту.
  - type: figure
    caption: "Тесты изоляции арендаторов"
    path: "./images/04-tenancy.png"
  - type: heading
    text: "3.3 Роли базы данных и аудит"
    level: 2
    structural: false
  - type: paragraph
    text: >
      У каждого сервиса две роли. Владелец применяет миграции и выполняет служебные процессы:
      ретранслятор событий, проекцию каталога, чистку и сверку. Роль данных обслуживает запросы
      пользователей и получает только чтение и запись строк, за вычетом явных запретов. В booking она
      не читает очередь событий, не меняет аудит, не пишет в реплику каталога, не удаляет брони.
  - type: paragraph
    text: >
      Журнал аудита допускает только добавление. Запись о брони пишется в той же транзакции, что и
      изменение. Политика записи сверяет автора с контекстом и его отношение к отелю; записи о шаге
      отключения отеля разрешены только служебному процессу, а служебный контекст действует только под
      владельцем таблиц.
  - type: heading
    text: "3.4 Границы защиты"
    level: 2
    structural: false
  - type: list
    style: bullet
    items:
      - "Политики доверяют контексту, который выставляет код сервиса. Код, намеренно выставивший чужую личность, увидит чужие строки. От этого защищает первый уровень."
      - "Владелец базы может снять защиту и удалить триггер аудита. Под ним работают служебные процессы того же сервиса."
      - "Журнал аудита есть только в booking. Кто назначил менеджера или выдал роль, по базе установить нельзя. Автор отключения отеля передаётся в событии и записывается в аудит booking."
      - "В сервисе notification входящий журнал открыт роли данных, потому что обработчик событий работает под ней."

  - type: heading
    text: "4 Конкурентность и идемпотентность"
    level: 1
    structural: true
  - type: paragraph
    text: >
      Правило вместимости проверено экспериментом: 25 транзакций одновременно бронируют последний
      номер. Наивный код «прочитать, проверить, записать» на уровне READ COMMITTED продаёт номер всем
      двадцати пяти. Четыре механизма защиты продают его ровно одному (рисунок 5).
  - type: figure
    caption: "Эксперимент: гонка за последний номер"
    path: "./images/05-experiment.png"
  - type: table
    caption: "Сравнение механизмов защиты"
    headers: ["Механизм", "Успехов из 25", "Повторов", "Особенность"]
    rows:
      - ["Без защиты", "25", "0", "Потерянная проверка; по счётчику остатков аномалия не видна"]
      - ["Блокировка строки", "1", "0", "Конкуренты ждут друг друга; расширяется на бронь из нескольких ночей"]
      - ["Оптимистичная запись", "1", "24", "Проигравшие повторяют попытку"]
      - ["Условная атомарная запись", "1", "0", "Быстрее всех, но годится для одной строки"]
      - ["SERIALIZABLE с повтором", "1", "24", "Проигравшие получают ошибку сериализации и повторяют"]
  - type: paragraph
    text: >
      Выбрана блокировка строк остатков. Бронь на несколько ночей меняет несколько строк, и только
      блокировка естественно расширяется на этот случай. Строки блокируются в порядке дат, поэтому
      взаимных блокировок нет. Цена - на популярной категории брони выстраиваются в очередь.
  - type: paragraph
    text: >
      Команда бронирования не принимается без ключа идемпотентности. Повтор с тем же ключом возвращает
      сохранённый ответ первого запроса, даже если бронь с тех пор отменена. Ключ проверяется раньше
      дат, поэтому повтор после полуночи не отклоняется как просроченный.

  - type: heading
    text: "5 События и согласованность между сервисами"
    level: 1
    structural: true
  - type: heading
    text: "5.1 Исходящие события"
    level: 2
    structural: false
  - type: paragraph
    text: >
      Распределённой транзакции при бронировании нет. Бронь, остатки, ответ команды, запись аудита и
      событие фиксируются одной локальной транзакцией: событие записывается в таблицу outbox той же
      базы. Ретранслятор берёт пачку событий в аренду короткой транзакцией и публикует её вне
      транзакции. Записать в очередь событие о чужой брони нельзя: политика сверяет конверт с бронью,
      которую видит автор.
  - type: heading
    text: "5.2 Доставка"
    level: 2
    structural: false
  - type: paragraph
    text: >
      Доставка выполняется «не менее одного раза». Получатель одной транзакцией вставляет отметку
      события во входящий журнал и выполняет действие, а смещение в брокере фиксирует после неё.
      Порядок между экземплярами ретранслятора не гарантируется, поэтому получатель сравнивает версии
      агрегата. Временную ошибку получатель повторяет до успеха; в карантин уходит только сообщение,
      которое повтор не исправит: неразбираемое, с незнакомой версией схемы, с нарушением контракта.
  - type: heading
    text: "5.3 Отключение отеля"
    level: 2
    structural: false
  - type: paragraph
    text: >
      Единственный распределённый процесс системы - отключение отеля (рисунок 6). Каталог фиксирует
      новый статус и событие. Сервис бронирования отменяет будущие брони отеля, служба уведомлений
      сообщает гостям. Центрального координатора нет: взаимодействие асинхронное, согласованность в
      конечном счёте, хореография.
  - type: figure
    caption: "Отключение отеля: хореография"
    path: "./images/02-saga.png"
  - type: paragraph
    text: >
      Три паттерна согласованности сравнены на этой операции в таблице 5. Выбран событийный: шаги
      независимы, а отказать по бизнес-причине им нечем. Цена - процесс нигде не виден целиком, и
      каталог не получает ответа о результате. След процесса - запись аудита отеля с числом отменённых
      броней и автором отключения. Отменяются только брони с заездом после текущего дня.
  - type: table
    caption: "Паттерны согласованности на примере отключения отеля"
    headers: ["Критерий", "Оркестрация запроса", "На основе событий", "Фоновая синхронизация"]
    rows:
      - ["Согласованность", "Сразу, пока все сервисы доступны", "В конечном счёте, секунды", "В конечном счёте, часы"]
      - ["Связанность", "Каталог знает о бронировании и уведомлениях", "Издатель не знает читателей", "Задача знает схемы всех сервисов"]
      - ["Владение данными", "Соблюдено", "Соблюдено", "Нарушено: внешний процесс пишет в чужие таблицы"]
      - ["Ответ администратору", "Число отменённых броней", "Отель отключён; итог в аудите", "Нет"]
      - ["При отказе бронирования", "Отключение не проходит или проходит частично", "Отключение проходит, событие дождётся", "До следующего запуска"]

  - type: heading
    text: "6 Нагрузка и инварианты"
    level: 1
    structural: true
  - type: paragraph
    text: >
      Замер выполнен сквозь весь путь запроса: gateway, сервис, база с политиками и блокировками.
      Сценарий shop - 80 % чтений доступности и 20 % броней, отели выбираются по Зипфу. Сценарий hot -
      запись в одну категорию на пересекающиеся даты. Число параллельных клиентов 1, 8 и 32, по три
      прогона длительностью 20-30 секунд, итог по медиане. Замер сделан на заново созданных базах;
      приложены выводы всех 18 прогонов.
  - type: table
    caption: "Итог замера по медиане трёх прогонов (1 / 8 / 32 клиента)"
    headers: ["Операция", "В секунду", "p95, мс", "p99, мс"]
    rows:
      - ["shop: чтение доступности", "651 / 1 163 / 1 284", "1.4 / 8.3 / 35.9", "3.0 / 13.2 / 50.9"]
      - ["shop: бронь", "163 / 291 / 321", "5.6 / 26.5 / 61.7", "8.3 / 44.6 / 86.2"]
      - ["hot: бронь в одну категорию", "289 / 477 / 563", "5.8 / 34.1 / 87.3", "8.3 / 50.1 / 106.3"]
  - type: paragraph
    text: >
      Ошибок в прогонах нет. Узкое место - процессор стенда: при 32 клиентах он занят на 95 %, а запрос
      доступности в базе выполняется меньше 0,2 мс. Одна категория выдерживает 480-560 броней в
      секунду: при росте числа клиентов вчетверо поток вырос на 18 %, а p95 - до 87 мс. Это цена
      блокировки строк.
  - type: paragraph
    text: >
      Полнота приложенных прогонов проверяется числом. В прогонах 150 230 успешных броней; в базе
      после опытов ровно столько же ключей идемпотентности, записей аудита, событий и уведомлений.
      Инварианты после опытов приведены в таблице 7.
  - type: table
    caption: "Инварианты после нагрузочных опытов"
    headers: ["Инвариант", "Чем защищён", "Нарушений"]
    rows:
      - ["Остаток не отрицательный", "Схема: ограничение CHECK", "0"]
      - ["Продано не больше, чем номеров", "Транзакция: блокировка строк остатков", "0 из 6 800 строк"]
      - ["Остатки равны числу подтверждённых броней", "Транзакция и фоновая сверка раз в час", "0"]
      - ["Один ключ - одна существующая бронь", "Схема: первичный ключ; транзакция", "0 из 150 230"]
      - ["У каждой записи аудита о брони есть бронь", "Транзакция; у роли данных нет права удаления", "0"]
      - ["Каждое изменение брони доходит до получателей", "Событие в одной транзакции с бронью; аренда и повтор", "Неопубликованных 0 из 150 230"]
  - type: paragraph
    text: >
      Замер оптимистичен: кэш прогрет, генератор работает замкнутым циклом на той же машине, прогоны
      короткие. Цифры пригодны для сравнения решений между собой, а не как обещание для эксплуатации.

  - type: heading
    text: "7 Проверка системы"
    level: 1
    structural: true
  - type: paragraph
    text: >
      Набор из 57 тестов выполняется с детектором гонок (рисунок 7). В него входят 37 интеграционных
      тестов на настоящем PostgreSQL под ролью данных, 6 сценариев получателя на настоящей Kafka, 12
      модульных и 2 архитектурных теста. Архитектурные тесты проверяют, что сервисы не импортируют
      друг друга и что каждый сервис с базой открывает два пула соединений.
  - type: figure
    caption: "Полный прогон тестов с детектором гонок"
    path: "./images/07-tests.png"
  - type: paragraph
    text: >
      Сквозной сценарий через gateway содержит 42 проверки: роли, доставка событий, десять
      одновременных броней одного номера, идемпотентность, изоляция данных, компенсация при отключении
      отеля и аудит (рисунок 8). Интерфейс менеджера показан на рисунке 9.
  - type: figure
    caption: "Сквозной сценарий через gateway"
    path: "./images/08-e2e.png"
  - type: figure
    caption: "Брони отеля в интерфейсе менеджера"
    path: "./images/03-ui-manager.png"

  - type: heading
    text: "8 Основные компромиссы"
    level: 1
    structural: true
  - type: table
    caption: "Основные решения проекта и их цена"
    headers: ["Решение", "Альтернатива", "Выигрыш", "Цена"]
    rows:
      - ["Пять сервисов", "Одно приложение с модулями", "Каждая граница обоснована силой", "Пять процессов, сетевые вызовы, отложенная согласованность данных"]
      - ["Остатки и брони в одном сервисе", "Сервис остатков и сага", "Правило вместимости в одной транзакции", "Крупный сервис"]
      - ["База на сервис, один сервер", "Общая база или четыре сервера", "Изоляция средствами СУБД", "Общая точка отказа"]
      - ["Реплика каталога событиями", "Синхронный запрос", "Брони работают при отказе каталога", "Отставание на секунду; права менеджера тоже на реплике"]
      - ["Общая модель размещения и защита строк", "Схема или база на отель", "Одна схема, дешёвые миграции", "Ошибка политики открывает всё; нужны два уровня и отрицательные тесты"]
      - ["Две роли на сервис", "Одна роль-владелец", "Код запросов не может снять защиту", "Две строки подключения; владелец остаётся в процессе"]
      - ["Блокировка строк остатков", "SERIALIZABLE или условная запись", "Нет повторов; работает для нескольких ночей", "Очередь на популярной категории"]
      - ["Таблица исходящих событий", "Последовательная запись в базу и в брокер", "Изменение и событие фиксируются вместе", "Повторная доставка; получатель обязан распознавать дубли"]
      - ["Хореография при отключении отеля", "Оркестратор", "Слабая связанность", "Процесс не виден целиком; зависимость от порядка событий"]
      - ["Неограниченный повтор при временном отказе", "Перенос в DLQ после пяти неудач", "Годное сообщение обрабатывается всегда", "Обработка раздела приостановлена на время отказа"]
  - type: paragraph
    text: >
      Из шестнадцати найденных дефектов три относятся не к коду, а к собственным неверным
      утверждениям в документах. Самый показательный: в первом паспорте нагрузки был удалён неудачный
      пробный прогон, а документ утверждал, что приложены все. Рецензия нашла это по базе стенда; замер
      выполнен заново на чистых базах, а в проверку добавлен инвариант, который такое удаление ловит.

  - type: heading
    text: "Заключение"
    level: 1
    structural: true
  - type: paragraph
    text: >
      Спроектировано и реализовано хранение данных распределённой системы бронирования. Границы
      сервисов обоснованы силами интеграции и дезинтеграции. У каждой таблицы один владелец, чужие
      данные сервис получает событиями. Данные арендаторов защищены на двух независимых уровнях,
      проверенных по отдельности. Правило вместимости сохраняется при конкурентных запросах, что
      показано экспериментом. События фиксируются вместе с изменением и доставляются без потери и без
      двойного эффекта.
  - type: paragraph
    text: >
      Заявленные свойства подтверждены 57 тестами, сквозным сценарием из 42 проверок и нагрузочным
      замером, полнота которого сходится с базой до единицы. Для каждого решения записаны альтернатива
      и цена, а границы защиты названы явно.
  - type: paragraph
    text: >
      Не сделано и записано как осознанные пробелы: метрики и трассировка, повторная подача сообщений
      из карантина, аутентификация брокера, журнал аудита в каталоге и в сервисе пользователей, замер
      открытым потоком на отдельной машине для базы.

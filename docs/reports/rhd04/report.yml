content:
  - type: heading
    text: "Введение"
    level: 1
    structural: true
  - type: paragraph
    text: >
      После бронирования номера система обязана сообщить о нём другим сервисам: уведомить клиента,
      обновить данные у читателей. Если сначала сохранить бронь, а затем отдельным действием отправить
      сообщение, процесс может завершиться между этими шагами. Бронь останется в базе, а сообщение о ней
      будет потеряно. Обратный порядок даёт сообщение о брони, которой нет.
  - type: paragraph
    text: >
      Цель работы - добиться, чтобы бизнес-объект, ответ команды и исходящее событие фиксировались одной
      транзакцией PostgreSQL или не фиксировались вовсе, и проверить это тестами на настоящей базе.
  - type: paragraph
    text: >
      Задачи работы: расширить схему очередью исходящих событий; описать контракт события; включить
      запись события в транзакцию настоящей команды; проверить фиксацию, повтор запроса, конфликт под
      прежним ключом и откат; показать захват и повторную выдачу событий ретранслятором; измерить
      очередь; выполнить три пункта варианта Б - изоляция и отказ команды.
  - type: paragraph
    text: >
      Работа выполнена на сквозном домашнем проекте TourFlow - сервисе бронирования отелей турфирмы.
      Опыты проведены 16.11.2026 на Go 1.24.7 и PostgreSQL 16.15. Код сервиса обращается к базе под
      ролью данных, которая таблицами не владеет; миграции и ретранслятор работают под ролью-владельцем.
      Все тесты запускались с детектором гонок и без кеширования результатов.

  - type: heading
    text: "1 Ход работы"
    level: 1
    structural: true

  - type: heading
    text: "1.1 Перенос занятия на собственную систему"
    level: 2
    structural: false
  - type: paragraph
    text: >
      Методические указания написаны для учебного стенда TeamBoard. В своей системе тем же шагам
      соответствуют другие объекты; соответствие приведено в таблице 1. Арендатором в TourFlow является
      отель: менеджер видит брони только своего отеля, клиент - только свои.
  - type: table
    caption: "Соответствие объектов занятия и системы TourFlow"
    headers: ["В методических указаниях", "В TourFlow"]
    rows:
      - ["Арендатор (tenant)", "Отель"]
      - ["Задача", "Бронь номера на интервал дат"]
      - ["Команда CreateTask", "Команда бронирования: POST /api/reservations с заголовком Idempotency-Key"]
      - ["Событие task.created", "Событие ReservationConfirmed (при отмене - ReservationCancelled)"]
      - ["Лимит открытых задач проекта", "Число номеров категории: продано не больше, чем есть, на каждую ночь"]
      - ["Таблица outbox_events", "Таблица outbox сервиса booking"]
      - ["Журнал идемпотентности", "Таблица idempotency_keys с сохранённым ответом команды"]

  - type: heading
    text: "1.2 Схема очереди исходящих событий"
    level: 2
    structural: false
  - type: paragraph
    text: >
      Очередь - таблица outbox в базе сервиса booking, то есть в той же базе, что и брони. Только при
      этом условии запись события может войти в транзакцию брони. Структура таблицы и её политики
      показаны на рисунке 1.
  - type: figure
    caption: "Таблица outbox и политики доступа к ней"
    path: "./images/01-outbox-schema.png"
  - type: paragraph
    text: >
      Служебные поля вынесены из конверта в колонки. Колонка event_id уникальна: одно событие не может
      быть записано дважды. Колонка aggregate_version хранит версию брони после изменения. Колонка
      hotel_id называет арендатора события. Колонки lease_owner и lease_until нужны ретранслятору для
      аренды, колонки attempts и last_error - для наблюдения за неудачными отправками.
  - type: paragraph
    text: >
      На таблице включена защита строк с принуждением и для владельца. Читать, отмечать и удалять
      события может только транзакция, объявившая себя ретранслятором. Роли данных выдано одно право -
      вставка, и то под условием политики outbox_append, которая разобрана в пункте 1.6.

  - type: heading
    text: "1.3 Контракт события"
    level: 2
    structural: false
  - type: paragraph
    text: >
      Команда выражает намерение, событие сообщает о свершившемся факте. Событие записывается в
      конверте, общем для всех тем. Назначение полей конверта приведено в таблице 2.
  - type: table
    caption: "Поля конверта события"
    headers: ["Поле", "Назначение"]
    rows:
      - ["event_id", "Идентификатор события. Ключ дедупликации у получателя: повторная доставка приходит с тем же значением"]
      - ["event_type", "Тип факта: ReservationConfirmed или ReservationCancelled. По нему получатель выбирает обработчик"]
      - ["schema_version", "Версия структуры конверта. Сообщение с незнакомой версией получатель откладывает, а не обрабатывает"]
      - ["occurred_at", "Время события по UTC. Служит диагностике, порядок по нему не определяется"]
      - ["aggregate_id", "Идентификатор брони. Он же ключ сообщения брокера: события одной брони идут в один раздел"]
      - ["aggregate_version", "Версия брони после изменения. Получатель применяет событие, только если версия больше сохранённой"]
      - ["producer", "Сервис-издатель"]
      - ["request_id", "Идентификатор исходного запроса для поиска в журналах"]
      - ["payload", "Снимок брони целиком: отель, категория, клиент, даты, сумма"]
  - type: paragraph
    text: >
      При повторной доставке получатель действует так. В одной транзакции он вставляет отметку с
      event_id в свою таблицу обработанных событий. Если отметка уже есть, вставка не добавляет строк, и
      транзакция завершается без действия. Если отметки не было, выполняется полезное действие, и оно
      фиксируется вместе с отметкой. Опоздавшее событие со старой версией брони не применяется.

  - type: heading
    text: "1.4 Единая граница фиксации команды бронирования"
    level: 2
    structural: false
  - type: paragraph
    text: >
      Запись события добавлена в настоящую команду бронирования, а не в отдельный пример. Одна
      транзакция уровня READ COMMITTED выполняет следующие действия.
  - type: list
    style: numeric
    items:
      - "Захватывает ключ идемпотентности клиента и сверяет отпечаток запроса."
      - "Блокирует строки остатков категории на все ночи брони в порядке дат."
      - "Проверяет, что на каждую ночь есть свободный номер, и увеличивает число проданных."
      - "Вставляет бронь."
      - "Сохраняет под ключом идемпотентности ответ команды."
      - "Записывает строку аудита."
      - "Записывает событие ReservationConfirmed в outbox."
  - type: paragraph
    text: >
      Проверка выполнена пятью тестами над настоящей командой; результат на рисунке 2, содержание
      проверок - в таблице 3.
  - type: figure
    caption: "Тесты фиксации, повтора, конфликта и отката"
    path: "./images/02-base-tests.png"
  - type: table
    caption: "Что доказывают тесты единой границы фиксации"
    headers: ["Тест", "Наблюдаемый результат"]
    rows:
      - ["TestOutboxCommittedWithReservation", "После брони в очереди одно событие ReservationConfirmed версии 1; отель, ключ сообщения и event_id в колонках совпадают с бронью и с конвертом"]
      - ["TestOutboxReplayReturnsStoredResponse", "Повтор с тем же ключом возвращает сохранённый ответ первого запроса даже после отмены брони; нового события нет"]
      - ["TestOutboxConflictUnderSameKey", "Тот же ключ с другим содержимым запроса отклонён; число событий не изменилось"]
      - ["TestOutboxRolledBackWithReservation", "Сбой после записи события откатывает всё: нет ключа, аудита, изменения остатков и события"]
      - ["TestIdempotency", "Десять одновременных повторов одного запроса дают одну бронь"]

  - type: heading
    text: "1.5 Вариант Б, пункт 1 - принадлежность сохранённого события"
    level: 2
    structural: false
  - type: paragraph
    text: >
      Наличие строки в очереди ещё не доказывает, что событие принадлежит нужному арендатору. Тест
      TestOutboxEnvelopeBelongsToTenant читает сохранённое событие так, как его читает ретранслятор, и
      сравнивает поля со значениями запроса: отель строки и отель в полезной нагрузке равны отелю
      запроса, агрегат и его версия равны идентификатору и версии созданной брони, клиент в полезной
      нагрузке равен автору команды. На рисунке 3 строка «запрос» и строка «конверт» совпадают.
  - type: figure
    caption: "Поля сохранённого конверта равны значениям запроса"
    path: "./images/03-variant-b1.png"

  - type: heading
    text: "1.6 Вариант Б, пункт 2 - событие чужого арендатора"
    level: 2
    structural: false
  - type: paragraph
    text: >
      Из контекста другого арендатора выполнена попытка сохранить событие о чужой брони. Для каждой
      попытки создаётся новый event_id, поэтому отказ политики нельзя спутать с нарушением уникальности.
      После отказа под контекстом ретранслятора проверяется, что строки с этим event_id в таблице нет.
      Результат теста TestOutboxForeignEventRejected показан на рисунке 4.
  - type: figure
    caption: "Отказ записи чужого события с кодом 42501"
    path: "./images/03-variant-b2.png"
  - type: paragraph
    text: >
      Отказ с кодом SQLSTATE 42501 получили другой клиент, менеджер другого отеля и запрос без
      контекста. Отказ получили и три попытки под честным контекстом, в которых конверт противоречит
      брони: менеджер отеля записывает событие о несуществующей брони; менеджер ставит в событие чужого
      клиента; владелец брони адресует событие другому человеку. Положительный контроль в том же тесте:
      владелец брони и менеджер её отеля правдивое событие сохраняют.
  - type: paragraph
    text: >
      Политика устроена так. Событие проходит, если его автор видит бронь-агрегат и конверт согласован
      с ней. Функция политики читает таблицу броней под защитой строк автора: клиент видит свои брони,
      менеджер - брони своего отеля. Затем она сверяет отель строки, отель и клиента в полезной
      нагрузке с самой бронью. Цена решения - одно чтение брони по первичному ключу на каждое событие.
  - type: paragraph
    text: >
      Тот же результат получен вне теста, в консоли под ролью данных на базе стенда (рисунок 5).
      Событие об отмене чужой брони отклонено, то же событие от владельца брони принято, а чтение
      очереди роли данных запрещено правами. Обе транзакции откатаны.
  - type: figure
    caption: "Запись события под ролью данных в консоли"
    path: "./images/04-forge-sql.png"

  - type: heading
    text: "1.7 Вариант Б, пункт 3 - отклонённая команда"
    level: 2
    structural: false
  - type: paragraph
    text: >
      В категории один номер. Первая команда бронирования проходит. Вторая команда другого клиента с
      новым ключом получает бизнес-отказ no_availability. Тест TestOutboxRejectedCommandLeavesNothing
      проверяет состояние именно для второй команды (рисунок 6): броней 0, ключей 0, строк аудита 0, а
      число событий в очереди осталось прежним.
  - type: figure
    caption: "Отклонённая команда не оставила брони, ключа и события"
    path: "./images/03-variant-b3.png"
  - type: paragraph
    text: >
      Отклонённая команда не должна порождать событие ReservationConfirmed, потому что событие сообщает
      о факте, а факта нет. Получатели не перепроверяют издателя: служба уведомлений отправила бы
      клиенту подтверждение брони, которой не существует. Отсутствие ключа идемпотентности также
      существенно: повтор той же команды позже, когда номер освободится, должен выполниться как новый
      запрос, а не вернуть сохранённый отказ.

  - type: heading
    text: "1.8 Захват и повторная выдача событий"
    level: 2
    structural: false
  - type: paragraph
    text: >
      Ретранслятор забирает пачку событий короткой транзакцией: отмечает строки своим именем и сроком
      аренды 30 секунд и фиксирует транзакцию. Публикация в брокер идёт уже вне транзакции. Второй
      короткой транзакцией опубликованные строки отмечаются. Если ретранслятор остановился после
      захвата, аренда истекает, и пачку забирает другой экземпляр; event_id при этом не меняется.
      Аренда не равна подтверждению: счётчик попыток растёт только при неудачной отправке.
  - type: figure
    caption: "Изоляция очереди и аренда ретранслятора"
    path: "./images/05-isolated-lease.png"
  - type: paragraph
    text: >
      На рисунке 7 три теста. TestRelayLease показывает, что пачку остановившегося ретранслятора после
      истечения аренды забирает другой, а живая аренда чужому не отдаётся. TestOutboxIsolated
      показывает, что роль данных не читает, не отмечает и не удаляет события, даже объявив себя
      ретранслятором, а владелец без такого объявления видит ноль строк. TestOutboxRelay проверяет
      отправку и отметку события.

  - type: heading
    text: "1.9 Измерение очереди"
    level: 2
    structural: false
  - type: paragraph
    text: >
      Состояние очереди на стенде измерено диагностическим запросом под контекстом ретранслятора
      (рисунок 8). После нагрузочного опыта в очереди 152 885 событий, все опубликованы, ожидающих
      нет, наибольшее число попыток равно нулю. Возраст старейшего ожидающего события пуст, потому что
      очередь разобрана.
  - type: figure
    caption: "Состояние очереди outbox на стенде"
    path: "./images/06-queue.png"
  - type: paragraph
    text: >
      Возраст старейшего ожидающего события важнее размера очереди. Очередь может быть короткой, но
      одно событие способно застрять надолго из-за постоянной ошибки отправки, и по одному размеру
      этого не видно.

  - type: heading
    text: "1.10 Полная проверка"
    level: 2
    structural: false
  - type: paragraph
    text: >
      Полный набор тестов пакета booking с детектором гонок завершился успешно (рисунок 9). В него
      входят 25 интеграционных тестов на настоящей базе под ролью данных и 4 теста предметной модели.
  - type: figure
    caption: "Полный прогон тестов пакета booking с детектором гонок"
    path: "./images/07-all-race.png"

  - type: heading
    text: "Заключение"
    level: 1
    structural: true
  - type: paragraph
    text: >
      Бронь, ответ команды, запись аудита и исходящее событие фиксируются одной транзакцией. Сбой после
      записи события откатывает всё; повтор запроса возвращает сохранённый ответ и не создаёт второго
      события; изменённое содержимое под прежним ключом отклоняется.
  - type: paragraph
    text: >
      По варианту Б установлено следующее. Сохранённый конверт принадлежит арендатору запроса: отель,
      бронь, её версия и клиент совпадают со значениями команды. Событие о чужой брони из чужого
      контекста отклоняется базой с кодом 42501 и в очереди отсутствует; отклоняется и событие,
      противоречащее брони, под честным контекстом. Отклонённая бизнес-правилом команда не оставляет
      ни брони, ни ключа, ни события.
  - type: paragraph
    text: >
      Граница решения названа прямо. Политика доверяет контексту, который выставляет код сервиса: код,
      намеренно выставивший чужой контекст, её обойдёт. Политика сверяет принадлежность события, но не
      его смысл: тип события она не проверяет. Очередь защищает от потери события до публикации, а
      доставка получателю и обработка повторов рассматриваются в следующей работе.

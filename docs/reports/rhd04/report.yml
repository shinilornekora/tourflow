document:
  output: "./build/Практическая работа 4 - Надёжное транзакционное ядро и исходящие события.docx"
  title_page:
    template: orlov-uvp271-20261017
    params:
      discipline: "Распределённые хранилища данных"
      work_number: "4"
      work_title: "Надёжное транзакционное ядро и исходящие события"
      variant: "Вариант Б, группа УВП-271"
      student: "Орлов Андрей Витальевич"

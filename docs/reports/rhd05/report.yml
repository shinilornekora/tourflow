  output: "./build/Практическая работа 5 - Доставка событий.docx"
  title_page:
    template: orlov-uvp271-20261017
    params:
      discipline: "Распределённые хранилища данных"
      work_number: "5"
      work_title: "Доставка событий"
      variant: "Вариант Б, группа УВП-271"
      student: "Орлов Андрей Витальевич"
      teacher: "старший преподаватель Заманов Е. А."
  toc: true

content:
  - type: heading
    text: "Введение"
    level: 1
    structural: true
  - type: paragraph
    text: >
      В предыдущей работе событие о брони фиксировалось в очереди outbox вместе с самой бронью. Это
      гарантирует, что событие не потеряется до публикации. Дальше событие проходит через брокер к
      получателю, и на этом пути возможны повторная доставка, остановка получателя посреди обработки и
      сообщение, которое обработать нельзя.
  - type: paragraph
    text: >
      Цель работы - построить получателя, который при доставке «не менее одного раза» выполняет
      полезное действие ровно один раз, не теряет корректные события и не останавливается на
      некорректных.
  - type: paragraph
    text: >
      Задачи работы: разделить подтверждение в базе и подтверждение смещения в брокере; вести входящий
      журнал и фиксировать его вместе с полезным действием; разделить ошибки контракта и ошибки
      инфраструктуры; проверить повторную доставку, остановку после фиксации в базе и изоляцию
      некорректных сообщений; выполнить три пункта варианта Б - эволюция контрактов и маршрутизация в
      карантин.
  - type: paragraph
    text: >
      Работа выполнена на сквозном домашнем проекте TourFlow. Опыты проведены 16.11.2026 на Go 1.24.7,
      PostgreSQL 16.15 и Apache Kafka 3.9.1. Сценарии доставки запускались на настоящем брокере и
      настоящей базе с детектором гонок.

  - type: heading
    text: "1 Ход работы"
    level: 1
    structural: true

  - type: heading
    text: "1.1 Перенос занятия на собственную систему"
    level: 2
    structural: false
  - type: paragraph
    text: >
      Методические указания написаны для стенда TeamBoard с брокером Redpanda. В TourFlow тем же
      понятиям соответствуют объекты из таблицы 1. Протокол брокера тот же, поэтому шаги занятия
      переносятся без изменения смысла.
  - type: table
    caption: "Соответствие объектов занятия и системы TourFlow"
    headers: ["В методических указаниях", "В TourFlow"]
    rows:
      - ["Брокер Redpanda", "Apache Kafka в режиме KRaft, один узел"]
      - ["Событие task.created", "ReservationConfirmed и ReservationCancelled сервиса booking; HotelUpserted сервиса catalog"]
      - ["Таблица inbox_messages", "Таблица processed_events у каждого получателя"]
      - ["Витрина task_activity", "Таблица notifications - уведомления клиента о его бронях"]
      - ["Тема для некорректных сообщений", "Тема с суффиксом .dlq рядом с исходной"]
      - ["Арендатор", "Адресат уведомления; строки чужих адресатов закрыты защитой строк"]

  - type: heading
    text: "1.2 Две границы подтверждения"
    level: 2
    structural: false
  - type: paragraph
    text: >
      У получателя две независимые границы. Первая - фиксация транзакции в PostgreSQL: с этого момента
      полезное действие выполнено. Вторая - фиксация смещения в брокере: с этого момента сообщение не
      будет доставлено снова. Между ними процесс может остановиться, и тогда сообщение придёт
      повторно. Получатель TourFlow фиксирует смещение вручную и только для сообщения, судьба которого
      решена. Порядок действий следующий.
  - type: list
    style: numeric
    items:
      - "Разобрать конверт и проверить контракт. Нарушение контракта - постоянная ошибка: сообщение уходит в тему .dlq."
      - "Открыть транзакцию и выставить контекст защиты строк."
      - "Вставить отметку с event_id во входящий журнал. Если отметка уже есть, завершить транзакцию без действия."
      - "Выполнить полезное действие, если версия брони в событии больше сохранённой."
      - "Зафиксировать транзакцию: отметка и действие сохраняются вместе."
      - "Только после этого зафиксировать смещение в брокере."

  - type: heading
    text: "1.3 Ошибки контракта и ошибки инфраструктуры"
    level: 2
    structural: false
  - type: paragraph
    text: >
      Ошибки разделены на два класса (таблица 2). Постоянную ошибку повтор не исправит, поэтому
      сообщение откладывается в карантин, а поток идёт дальше. Временная ошибка относится не к
      сообщению, а к окружению, поэтому сообщение повторяется до успеха и в карантин не уходит.
  - type: table
    caption: "Классификация ошибок обработки"
    headers: ["Класс", "Примеры", "Действие получателя"]
    rows:
      - ["Постоянная", "Не разбирается JSON; нет event_id или типа; незнакомая версия схемы; нулевое время события; ошибка данных PostgreSQL классов 22 и 23; отказ политики защиты строк при записи", "Сообщение в тему .dlq с причиной в заголовках, смещение фиксируется, поток продолжается"]
      - ["Временная", "База недоступна; истёк тайм-аут; ошибка сериализации 40001; ожидание блокировки 55P03", "Повтор с возрастающей паузой, пока не получится; смещение не фиксируется; в карантин не уходит"]
  - type: paragraph
    text: >
      Классификация проверена модульными тестами (рисунок 1). TestIsPermanent перебирает ошибки обоих
      классов, TestEnvelopeContract - варианты конверта. Каждая попытка обработки ограничена тайм-аутом
      контекста 10 секунд, запрос к базе - 5 секундами, ожидание блокировки - 2 секундами. Пауза между
      повторами растёт до 5 секунд.
  - type: figure
    caption: "Модульные тесты контракта конверта и классификации ошибок"
    path: "./images/01-contract-unit.png"

  - type: heading
    text: "1.4 Атомарный обработчик и локальная проекция"
    level: 2
    structural: false
  - type: paragraph
    text: >
      Получатель событий о бронях - сервис notification. Его проекция - таблица уведомлений клиента.
      Обработчик работает под ролью данных, которая таблицами не владеет; строки уведомлений закрыты
      защитой строк по адресату. Отметка входящего журнала и уведомление записываются одной
      транзакцией. Тесты обработчика на настоящей базе показаны на рисунке 2 и разобраны в таблице 3.
  - type: figure
    caption: "Тесты обработчика уведомлений на настоящей базе"
    path: "./images/04-notification.png"
  - type: table
    caption: "Тесты обработчика уведомлений"
    headers: ["Тест", "Наблюдаемый результат"]
    rows:
      - ["TestRedeliveryCreatesOneNotification", "Одно событие доставлено несколько раз - уведомление одно"]
      - ["TestStaleEventIsNotDelivered", "Событие со старой версией брони, пришедшее после нового, уведомления не порождает"]
      - ["TestBrokenEventIsPermanent", "Событие с неразбираемой полезной нагрузкой - постоянная ошибка, следов в базе нет"]
      - ["TestNotificationsIsolatedByRLS", "Чужие уведомления не видны и не меняются; без контекста - ноль строк; записать уведомление другому адресату нельзя"]

  - type: heading
    text: "1.5 Сценарии доставки на настоящем брокере"
    level: 2
    structural: false
  - type: paragraph
    text: >
      Пять сценариев выполняются на настоящей Kafka; для каждого создаётся своя тема и своя группа
      получателей. Результат на рисунке 3, содержание - в таблице 4.
  - type: figure
    caption: "Сценарии доставки на настоящей Kafka"
    path: "./images/03-kafka-scenarios.png"
  - type: table
    caption: "Сценарии доставки"
    headers: ["Сценарий", "Что происходит", "Результат"]
    rows:
      - ["Некорректное сообщение между двумя корректными", "В тему уходят корректное, «не JSON» и корректное", "Оба корректных обработаны по порядку; некорректное один раз лежит в .dlq с причиной; после перезапуска группы ничего не приходит повторно"]
      - ["Временная ошибка", "Обработчик несколько раз подряд возвращает ошибку соединения", "Событие не уходит в .dlq и не теряется; следующее обрабатывается только после него"]
      - ["Отказ публикации в карантин", "Публикация в .dlq отказывает (брокер доступен, отказ имитирует обёртка издателя)", "Смещение не фиксируется, пока сообщение не легло в .dlq; событие не потеряно"]
      - ["Ошибка данных", "База возвращает ошибку класса 22", "Событие сразу в .dlq, без повторов"]
      - ["Остановка после фиксации в базе", "Транзакция обработчика зафиксирована, получатель остановлен до фиксации смещения", "После перезапуска событие приходит снова, входящий журнал отсекает повтор; эффект ровно один"]

  - type: heading
    text: "1.6 Вариант Б, пункт 1 - новое необязательное поле"
    level: 2
    structural: false
  - type: paragraph
    text: >
      Пункты варианта выполнены одним тестом TestContractEvolutionAndQuarantine на настоящей Kafka с
      входящим журналом в PostgreSQL. В одну тему по порядку отправлены пять сообщений: событие e1;
      копия e1 с тем же event_id и новым полем client_meta в корне конверта; событие q с версией схемы
      999; событие z с нулевым временем; событие e2. Вывод теста приведён на рисунке 4.
  - type: figure
    caption: "Эволюция контракта и карантин на настоящей Kafka"
    path: "./images/02-quarantine.png"
  - type: paragraph
    text: >
      Строка «статусы обработчика» показывает, что расширенная копия e1 дошла до обработчика и получила
      статус duplicate. В карантин она не попала. Новое необязательное поле не нарушает обратную
      совместимость: получатель читает только известные ему поля, а неизвестные пропускает. Повтор
      отсечён входящим журналом по event_id, как и для обычной повторной доставки.

  - type: heading
    text: "1.7 Вариант Б, пункт 2 - незнакомая версия схемы"
    level: 2
    structural: false
  - type: paragraph
    text: >
      Событие q с версией схемы 999 и новым event_id до обработчика не дошло: в списке статусов его
      нет. В базе две отметки входящего журнала и два эффекта, карантинных среди них ноль. В теме .dlq
      лежит сообщение с исходным смещением 2 и причиной «unsupported schema_version 999». Сообщение
      сохранено исходными байтами, поэтому версия схемы издателя в нём не изменена; тест читает её из
      карантина и сверяет.
  - type: paragraph
    text: >
      Получатель знает старшую понятную ему версию схемы. Большая версия означает, что смысл полей мог
      измениться, и обработка «как понял» дала бы неверный результат без какой-либо ошибки. Отсюда
      правило развёртывания: сначала обновляются получатели, затем издатель. При обратном порядке
      весь поток уйдёт в карантин.

  - type: heading
    text: "1.8 Вариант Б, пункт 3 - нулевое время события"
    level: 2
    structural: false
  - type: paragraph
    text: >
      Модульный тест TestEnvelopeContract дополнен случаями с нулевым и отсутствующим временем события:
      проверка контракта возвращает постоянную ошибку (рисунок 1). В интеграционном тесте событие z с
      нулевым временем отправлено в тему перед корректным событием e2. На рисунке 4 событие z лежит в
      теме .dlq с исходным смещением 3 и причиной «envelope without occurred_at», а событие e2
      получило статус processed. Получатель продолжил обработку следующих сообщений без ручного
      вмешательства.

  - type: heading
    text: "1.9 Входящий журнал на стенде"
    level: 2
    structural: false
  - type: paragraph
    text: >
      После нагрузочного опыта на стенде проверено соответствие входящего журнала и эффектов
      (рисунок 5). В сервисе notification 152 885 уведомлений и столько же отметок входящего журнала:
      на каждое событие о брони приходится одно уведомление. В сервисе booking 82 отметки о событиях
      каталога двух типов.
  - type: figure
    caption: "Отметки входящего журнала и эффекты на стенде"
    path: "./images/05-inbox-sql.png"

  - type: heading
    text: "Заключение"
    level: 1
    structural: true
  - type: paragraph
    text: >
      Получатель фиксирует отметку входящего журнала и полезное действие одной транзакцией, а смещение
      в брокере - только после неё. Повторная доставка и остановка после фиксации в базе дают один
      эффект. Временная ошибка повторяется до успеха; в карантин уходят только сообщения, которые
      повтор не исправит.
  - type: paragraph
    text: >
      По варианту Б установлено следующее. Новое необязательное поле в конверте не ломает получателя:
      повтор с тем же event_id получает статус duplicate. Сообщение с версией схемы 999 и сообщение с
      нулевым временем события уходят в карантин исходными байтами и не оставляют следов во входящем
      журнале и в эффектах. Корректное событие, отправленное следом, обрабатывается.
  - type: paragraph
    text: >
      Ограничения решения. Временная ошибка останавливает раздел темы до её устранения: порядок событий
      одной брони поставлен выше скорости. Инструмента повторной подачи из карантина нет, сообщения из
      него разбираются вручную. Отказ публикации в карантин проверен имитацией, а не отключением
      брокера. Проекция каталога в сервисе booking работает под ролью-владельцем, а не под ролью
      данных: ей нужна запись в таблицы, на которых держатся политики защиты строк.

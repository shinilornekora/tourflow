# SPA и API на одном origin: браузер видит только :3000, nginx проксирует
# /api в gateway. CORS не нужен, cookie с refresh-токеном работает как есть.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 15s;
    }

    # Файлы с contenthash в имени неизменяемы — кэшируем на год.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html не кэшируем, иначе пользователь не увидит новый релиз.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header Referrer-Policy strict-origin-when-cross-origin;
        try_files $uri /index.html;
    }
}
